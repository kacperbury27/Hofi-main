<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#06060f" />
    <meta name="description" content="Aplikacja do zarządzania budżetem domowym i śledzenia transakcji finansowych" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HouseFinance" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' font-size='100' dominant-baseline='middle' text-anchor='middle'>🏠</text></svg>" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%2300d9a3' width='180' height='180' rx='40'/><text x='90' y='90' font-size='120' dominant-baseline='middle' text-anchor='middle'>🏠</text></svg>" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #06060f; font-family: 'Outfit', sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #root { min-height: 100vh; }
    </style>
    <title>HouseFinance - Budget Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js').then(reg => {
          console.log('✓ Service Worker registered');
        }).catch(err => {
          console.log('✗ Service Worker registration failed:', err);
        });
      }
    </script>
  </body>
</html>
